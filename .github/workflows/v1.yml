name: V1 validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check documentation and workflow consistency
        run: python3 scripts/check-repository-consistency.py
      - run: npm ci
      - run: npm run typecheck && npm run build
      - run: npm run test:isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-test-evidence
          path: |
            docs_intern/openapi.json
            docs_intern/proofs/v1-hardening
            docs_intern/proofs/coverage
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate frontend when included in repository
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
            npm test
            npm run build
            npm run test:seo
            npx playwright install --with-deps chromium
            npm run test:browser
            npm run build:admin
            npm run test:admin
          fi
