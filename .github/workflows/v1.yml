name: V1 validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check documentation and workflow consistency
        run: python3 scripts/check-repository-consistency.py
      - run: npm ci
      - name: Check encrypted archive authentication
        run: node --test scripts/security/legacy-archive.test.mjs
      - run: npm run typecheck && npm run build
      - name: Enforce 95 percent backend unit line coverage
        run: npm run coverage:unit
      - name: Prepare browser integration dependencies
        run: npm ci --prefix frontend
      - name: Install browser for backend integration tests
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build application and admin for backend integration tests
        run: npm run build --prefix frontend && npm run build:admin --prefix frontend
      - run: npm run test:isolated
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-test-evidence
          path: |
            docs/openapi.json
            docs/proofs/v1-hardening
            docs/proofs/coverage
            docs/proofs/unit-coverage
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate frontend when included in repository
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
            npm test
            npm run build
            npm run test:seo
            npx playwright install --with-deps chromium
            npm run test:browser
            npm run build:admin
            npm run test:admin
          fi
