name: infimatch
services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: infimatch
      POSTGRES_USER: infimatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infimatch -d infimatch"]
      interval: 3s
      timeout: 3s
      retries: 30
  mongo:
    image: mongo:8.0.5@sha256:7bd28e5eea1c5766a084d5818254046f3ebe3b8f20a65e3a274640189e296667
    environment:
      MONGO_INITDB_ROOT_USERNAME: infimatch
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?required}
    ports: ["127.0.0.1:57017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 30
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.7@sha256:a8c95f75c6fdf65f5f2b7a7b354744eaa1c62bb911b5c00af6499c3f38e4cd32
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      GENERIC_TIMEZONE: Europe/Paris
      TZ: Europe/Paris
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      INFIMATCH_SERVICE_TOKEN: ${SERVICE_TOKEN:?required}
      INFIMATCH_API: http://host.docker.internal:3100/api/v1
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
    ports: ["127.0.0.1:55678:5678"]
    volumes: [n8n-data:/home/node/.n8n]
    profiles: [automation]
volumes:
  postgres-data:
  mongo-data:
  n8n-data:
